<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Launch alerts · Holmstead</title>
<style>
:root { --bg: #f7f5ef; --fg: #1d1d1b; --muted: #5d5b55; --accent: #8a6d12; }
@media (prefers-color-scheme: dark) { :root { --bg: #151513; --fg: #f1efe8; --muted: #b5b2a8; --accent: #d9b23a; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
h1 { font-size: 1.6em; margin: 0 0 12px; }
p { margin: 0 0 14px; overflow-wrap: anywhere; }
a { color: var(--accent); }
.muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="alerts-title">Launch alerts</h1>
  <p id="alerts-text">This page shows the result of a link in one of our launch emails.</p>
  <p class="muted"><a href="/" id="alerts-home">Back to holmsuite.com</a> · <a href="/privacy#launch-alerts" id="alerts-privacy">Privacy</a></p>
</main>
<script>
(function () {
  var r = new URLSearchParams(location.search).get('r');
  var pages = {
    confirmed: ['You’re on the list', 'Thanks for confirming. We’ll email you once when each app you picked comes out on your phone. Every email has a link to stop them.'],
    unsubscribed: ['You’re off the list', 'We’ve deleted your email address and choices. You won’t get any more launch emails from us.'],
    invalid: ['That link didn’t work', 'It may have expired (confirm links last 7 days) or already been used. You can sign up again on the homepage.'],
    error: ['Something went wrong', 'Please try the link again in a few minutes. If it keeps happening, email privacy@holmsuite.com.']
  };
  var p = pages[r];
  if (!p) return;
  document.getElementById('alerts-title').textContent = p[0];
  document.getElementById('alerts-text').textContent = p[1];
  document.title = p[0] + ' · Holmstead';
})();
</script>
</body>
</html>
