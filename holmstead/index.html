    <script>
      // The calendar's browser database (expo-sqlite) needs a "cross-origin isolated" page, which takes
      // two response headers GitHub Pages can't send. coi-serviceworker.js adds them; the page reloads
      // once, on the first visit, so the worker is in charge. The sessionStorage flag stops any loop.
      (function () {
        if (window.crossOriginIsolated || !window.isSecureContext || !('serviceWorker' in navigator)) return
        var base = location.pathname.indexOf('/holmstead/') === 0 ? '/holmstead/' : '/'
        navigator.serviceWorker.register(base + 'coi-serviceworker.js', { scope: base }).then(function (reg) {
          var reload = function () {
            try { if (sessionStorage.getItem('coi-reloaded')) return; sessionStorage.setItem('coi-reloaded', '1') } catch (e) { return }
            location.reload()
          }
          if (navigator.serviceWorker.controller) reload()
          else navigator.serviceWorker.addEventListener('controllerchange', reload)
        }).catch(function () {})
      })()
    </script>
